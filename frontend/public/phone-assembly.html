<script>
(()=>{

 const leaves=[...svg.querySelectorAll('path,rect,circle,ellipse,polygon,polyline,line')].filter(e=>!e.closest('defs,clipPath,mask,pattern'));
 for(const node of leaves){
  let box,matrix,parentMatrix;
  try{box=node.getBBox();matrix=rootMatrix.inverse().multiply(node.getCTM());parentMatrix=rootMatrix.inverse().multiply(node.parentElement.getCTM())}catch{continue}

  const left=Math.min(...corners.map(p=>p.x))/2,right=Math.max(...corners.map(p=>p.x))/2;
  if(right-left>115)continue;
  const center=(left+right)/2, group=ranges.findIndex(([a,b])=>center>=a&&center<=b);
  if(group<0)continue;

  const style=getComputedStyle(node), wrapper=document.createElementNS(ns,'g');
  for(const property of ['fill','stroke','stroke-width','stroke-linecap','stroke-linejoin','fill-opacity','stroke-opacity','opacity','fill-rule']) wrapper.style.setProperty(property,style.getPropertyValue(property));
  wrapper.setAttribute('transform',`matrix(${parentMatrix.a} ${parentMatrix.b} ${parentMatrix.c} ${parentMatrix.d} ${parentMatrix.e} ${parentMatrix.f})`);
  wrapper.appendChild(node);layers[group].appendChild(wrapper);
 }

  for(let i=0;i<layers.length;i++){
