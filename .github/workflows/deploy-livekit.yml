name: Deploy LiveKit voice agent

on:
  push:
    branches: [main]
    paths:
      - 'backend/app/**'
      - 'backend/tools/**'
      - 'backend/tests/**'
      - 'backend/requirements*.txt'
      - 'voiceagent/**'
      - 'scripts/prepare_livekit_build.py'
      - 'scripts/verify_livekit_deployment.py'
      - 'Dockerfile'
      - '.dockerignore'
      - 'livekit.toml'
      - '.github/workflows/deploy-livekit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: livekit-production
  cancel-in-progress: false

jobs:
  deploy:
    # Manual runs cannot deploy unreviewed branch commits to production.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            voiceagent/requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run backend tests
        working-directory: backend
        env:
          PYTHONPATH: ..
        run: python -m unittest discover -s tests -q
      - name: Prepare clean Python agent context
        run: python scripts/prepare_livekit_build.py "$RUNNER_TEMP/livekit-agent"
      - name: Install verified LiveKit CLI
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/lk_2.19.3_linux_amd64.tar.gz"
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/livekit/livekit-cli/releases/download/v2.19.3/lk_2.19.3_linux_amd64.tar.gz \
            --output "$archive"
          echo "b35cb7f09c611104eb2678377de725378c8e257ecbc1deb88a8beade13de9f03  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" lk
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Deploy to LiveKit Cloud
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        working-directory: ${{ runner.temp }}/livekit-agent
        shell: bash
        run: |
          set -euo pipefail
          for name in LIVEKIT_URL LIVEKIT_API_KEY LIVEKIT_API_SECRET; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing GitHub Actions secret: $name" >&2
              exit 1
            fi
          done
          lk --yes agent deploy --no-default-attributes \
            --attribute "git_commit=$GITHUB_SHA" --attribute "git_branch=main"
      - name: Verify deployed commit is running
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        run: python scripts/verify_livekit_deployment.py "$RUNNER_TEMP/livekit-agent"
